services:
  postgres_test:
    image: postgres:15-alpine
    container_name: testing_playground_postgres_test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: testing_playground_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d testing_playground_test"]
      interval: 5s
      timeout: 5s
      retries: 5
